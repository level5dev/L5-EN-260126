<div class="grid-item index-wrapper over-padding-left" style="justify-content:center;">
    <div class="index-round">{{index}}</div>
</div>
<div class="grid-item sch-item-sku">{{sku}}</div>
<div class="grid-item sch-item-name-wrapper">
    <div class="item--name sch-item-desc">{{name}}</div>
    {{#if quantity '==' 0}}
    <p class="text-sm-red">Not Available</p>
    {{/if}}
</div>
{{!-- #if price '==' '0'}}
    <div class="grid-item"></div>
    <div class="grid-item js-card-atc" style="justify-content: end;">
        <button class="button sch-btn-disabled" disabled>{{lang 'unavailable.text'}}</button>
    </div>
{{else --}}
<div id="" class="grid-item">${{price}}</div>
    
<div class="grid-item js-card-atc over-padding-right">
    <div class="card-atc__section card-atc__section--qty">
        <label for="card-atc__qty-{{id}}" class="card-atc__label is-srOnly">{{lang 'products.quantity'}}:</label>
        <div class="card-atc-increment--has-buttons js-card-atc-increment">
            <div class="form-increment incr-mob">
                <button class="button button--icon" data-action="dec" type="button" tabindex="0">
                    <span class="icon-wrapper" aria-hidden="true">
                        <svg class="icon">
                            <use xlink:href="#icon-keyboard-arrow-down"></use>
                        </svg>
                    </span>
                </button>
                <input type="tel" class="form-input form-input--incrementTotal js-card-atc__input--total" name="card-atc__qty-{{id}}" id="card-atc__qty-{{id}}" value="1" min="1" pattern="[0-9]*" aria-live="polite" tabindex="0">
                <button class="button button--icon" data-action="inc" type="button" tabindex="0">
                    <span class="icon-wrapper" aria-hidden="true">
                        <svg class="icon">
                            <use xlink:href="#icon-keyboard-arrow-up"></use>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
    </div>
    <div class="card-atc__section card-atc__section--action adc-col">
        {{#if quantity '==' 0}}
        <button type="button" class="card-atc__button button adc-btn" disabled>{{lang 'products.add_to_cart'}}</button>
        <button type="button" class="button parts s2 w-button adc-btn-mob" disabled>{{lang 'products.add'}}</button>
        {{else}}
        <button type="button" class="card-atc__button button button--primary js-card-atc__button adc-btn" id="card-atc__add-{{id}}" data-default-message="{{lang 'products.add_to_cart'}}" data-wait-message="{{lang 'products.adding_to_cart'}}" data-added-message="{{lang 'products.add_to_cart'}}" value="{{lang 'products.add_to_cart'}}" data-card-add-to-cart="/cart.php?action=add&amp;product_id={{id}}" data-event-type="product-click" tabindex="0">{{lang 'products.add_to_cart'}}</button>
        <button type="button" class="button button--primary js-card-atc__button parts s2 w-button adc-btn-mob" id="card-atc__add-{{id}}" data-default-message="{{lang 'add'}}" data-wait-message="…" data-added-message="{{lang 'products.add'}}" value="{{lang 'products.add'}}" data-card-add-to-cart="/cart.php?action=add&amp;product_id={{id}}" data-event-type="product-click" tabindex="0">{{lang 'products.add'}}</button>
        <span class="product-status-message aria-description--hidden">{{lang 'products.add_to_cart_item_added'}}</span>
        {{/if}}
    </div>
    <div id="previewModal" class="modal modal--large" data-reveal>
        <button class="modal-close" type="button" title="Close">
            <span class="aria-description--hidden">{{lang 'common.close'}}</span>
            <span aria-hidden="true">&#215;</span>
        </button>
        <div class="modal-content"></div>
        <div class="loadingOverlay"></div>
    </div>
</div>

{{!-- /if --}}
